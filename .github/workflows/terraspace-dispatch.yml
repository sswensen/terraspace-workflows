name: Terraspace Dispatch

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label"
        type: string
        required: true
      terraform_version:
        description: "Terraform version to install"
        type: string
        default: "1.10.5"
      ruby_version:
        description: "Ruby version"
        type: string
        default: "3.1"
      aws_region:
        description: "AWS region"
        type: string
        default: us-east-1
      ts_env:
        description: "Terraspace environment"
        type: string
        required: true
      command:
        description: "Terraspace command to run (e.g., 'plan demo', 'up networking')"
        type: string
        required: true
      vault_secret_path:
        description: "Vault KV path for AWS credentials"
        type: string
        default: dotfiles/aws
      vault_kubeconfig_path:
        description: "Vault KV path for kubeconfig (optional, enables k8s access)"
        type: string
        default: ""
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_GITHUB_TOKEN:
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runner }}

    env:
      AWS_REGION: ${{ inputs.aws_region }}
      GH_TOKEN: ${{ github.token }}
      TS_ENV: ${{ inputs.ts_env }}
      TS_VERSION_CHECK: "0"

    steps:
    - name: Setup tool cache
      run: |
        sudo mkdir -p /opt/hostedtoolcache
        sudo chown -R $(id -u):$(id -g) /opt/hostedtoolcache

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: apt-${{ runner.os }}-build-essential

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev unzip

    - name: Cache Terraform and Infracost
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/bin/terraform
          /usr/local/bin/infracost
        key: tools-${{ runner.os }}-terraform-${{ inputs.terraform_version }}

    - name: Checkout
      uses: actions/checkout@v4

    - name: Import secrets from Vault
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: github
        githubToken: ${{ secrets.VAULT_GITHUB_TOKEN }}
        secrets: |
          ${{ inputs.vault_secret_path }} access_key_id | AWS_ACCESS_KEY_ID ;
          ${{ inputs.vault_secret_path }} secret_access_key | AWS_SECRET_ACCESS_KEY

    - name: Import kubeconfig from Vault
      if: inputs.vault_kubeconfig_path != ''
      id: kubeconfig-vault
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: github
        githubToken: ${{ secrets.VAULT_GITHUB_TOKEN }}
        exportEnv: false
        secrets: |
          ${{ inputs.vault_kubeconfig_path }} config | KUBECONFIG_CONTENT

    - name: Setup kubeconfig
      if: inputs.vault_kubeconfig_path != ''
      run: |
        mkdir -p ~/.kube
        echo "$KUBECONFIG_CONTENT" > ~/.kube/config
        chmod 600 ~/.kube/config
        echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
      env:
        KUBECONFIG_CONTENT: ${{ steps.kubeconfig-vault.outputs.KUBECONFIG_CONTENT }}

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby_version }}
        bundler-cache: true

    - name: Install Terraform
      run: |
        if [ -f /usr/local/bin/terraform ] && terraform version | grep -q "${{ inputs.terraform_version }}"; then
          echo "Terraform ${{ inputs.terraform_version }} already installed (cached)"
        else
          curl -fsSL "https://releases.hashicorp.com/terraform/${{ inputs.terraform_version }}/terraform_${{ inputs.terraform_version }}_linux_amd64.zip" -o /tmp/terraform.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
          rm /tmp/terraform.zip
        fi
        terraform --version

    - name: Install Terraspace
      run: |
        bundle install
        bundle exec terraspace version

    - name: Run Terraspace
      run: |
        bundle exec terraspace ${{ inputs.command }} -y
